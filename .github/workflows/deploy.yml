name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: traceability-mock
  CONTAINER_NAME: traceability-mock
  # Port on the VPS mapped to nginx :80. Set repo variable HOST_PORT (Settings > Secrets and variables > Actions > Variables) to override.
  HOST_PORT: ${{ vars.HOST_PORT || '8080' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run -d --name smoke -p 18080:80 "$IMAGE_NAME:$GITHUB_SHA"
          for i in $(seq 1 15); do
            curl -fsS http://127.0.0.1:18080/healthz && curl -fsS http://127.0.0.1:18080/ >/dev/null && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Deploy to VPS over SSH
        if: github.event_name != 'pull_request'
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSHPASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          SSH="sshpass -e ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -o ServerAliveInterval=30 $SSH_USER@$SSH_HOST"

          echo "Uploading image..."
          docker save "$IMAGE_NAME:$GITHUB_SHA" | gzip | $SSH "gunzip | docker load"

          echo "Switching container..."
          $SSH "bash -s -- '$CONTAINER_NAME' '$IMAGE_NAME' '$GITHUB_SHA' '$HOST_PORT'" <<'REMOTE'
          set -u
          NAME=$1; IMAGE=$2; TAG=$3; PORT=$4
          NEW="$IMAGE:$TAG"

          # Remember the image of the currently RUNNING container (if any) for rollback
          PREV=""
          if [ "$(docker inspect -f '{{.State.Running}}' "$NAME" 2>/dev/null)" = "true" ]; then
            PREV=$(docker inspect -f '{{.Config.Image}}' "$NAME")
          fi
          docker rm -f "$NAME" >/dev/null 2>&1 || true

          rollback() {
            echo "Deploy failed, rolling back"
            docker logs "$NAME" 2>&1 | tail -30 || true
            docker rm -f "$NAME" >/dev/null 2>&1 || true
            if [ -n "$PREV" ]; then
              docker run -d --name "$NAME" --restart unless-stopped -p "127.0.0.1:$PORT:80" "$PREV" >/dev/null \
                && echo "Rolled back to $PREV"
            fi
            exit 1
          }

          # Bound to loopback only: public access goes through the host nginx (HTTPS)
          docker run -d --name "$NAME" --restart unless-stopped \
            -p "127.0.0.1:$PORT:80" "$NEW" >/dev/null || rollback

          ok=0
          for i in $(seq 1 20); do
            if curl -fsS "http://127.0.0.1:$PORT/healthz" >/dev/null 2>&1; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" -eq 1 ] || rollback

          docker tag "$NEW" "$IMAGE:latest"
          docker image prune -f >/dev/null
          echo "Deployed $NEW"
          REMOTE